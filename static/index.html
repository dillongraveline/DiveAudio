<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DiveAudio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080910;--surface:#0F111A;--border:#1C2030;--txt:#E9EBF2;--muted:#6E7689;
--bass:#6B4BFF;--drums:#FF9F45;--vocals:#FFEBC2;--mover:#2FE3D0}
body{background:var(--bg);color:var(--txt);font:14px/1.5 Inter,-apple-system,system-ui,sans-serif;
height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{height:52px;background:var(--surface);display:flex;align-items:center;justify-content:space-between;
padding:0 20px;flex:0 0 auto;border-bottom:1px solid var(--border)}
.brand{display:flex;gap:9px;align-items:center;font-weight:600;letter-spacing:.3px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mover)}
.eng{font-size:11px;color:var(--muted)}
main{flex:1;display:flex;min-height:0}
aside{width:290px;background:var(--surface);border-right:1px solid var(--border);display:flex;
flex-direction:column;flex:0 0 auto}
.searchwrap{padding:14px}
#q{width:100%;height:36px;background:#161A27;border:1px solid var(--border);border-radius:9px;
color:var(--txt);padding:0 12px;font:13px Inter,sans-serif;outline:none}
#q:focus{border-color:#2b3550}
.up{display:block;margin-top:10px;height:36px;line-height:34px;text-align:center;border:1px dashed #2b3550;
border-radius:9px;color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up:hover{border-color:var(--mover);color:var(--mover)}
aside.drag{outline:2px dashed var(--mover);outline-offset:-6px}
.scope{font-size:9.5px;letter-spacing:1px;color:var(--muted);padding:0 16px 8px;font-weight:600}
#list{flex:1;overflow-y:auto;padding:0 8px 8px}
.row{padding:9px 11px;border-radius:8px;cursor:pointer}
.row:hover{background:#131826}
.row.active{background:#17202E}
.row .t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.active .t{color:var(--mover);font-weight:600}
.row .s{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
section{flex:1;display:flex;flex-direction:column;min-width:0}
#view{flex:1;position:relative;min-height:0}
#view canvas{display:block;position:absolute;inset:0;z-index:1}
#legend{position:absolute;z-index:4;left:22px;bottom:18px;font-size:10.5px;line-height:1.9;color:var(--muted)}
#legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}
#status{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;
justify-content:center;gap:14px;background:rgba(8,9,16,.93);text-align:center;padding:24px}
#status.on{display:flex}
#status .eb{font-size:10px;letter-spacing:2.2px;color:var(--mover);font-weight:600}
#status .h{font-size:26px;font-weight:600}
#status .sub{font-size:12.5px;color:var(--muted);max-width:420px}
footer{height:84px;background:var(--surface);border-top:1px solid var(--border);display:flex;
align-items:center;gap:20px;padding:0 20px;flex:0 0 auto}
#play{width:40px;height:40px;border-radius:50%;background:var(--mover);border:0;cursor:pointer;
color:#06231F;font-size:15px;flex:0 0 auto}
#play:disabled{opacity:.35;cursor:default}
.np{width:200px;min-width:0}
.np .t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .s{font-size:10.5px;color:var(--muted)}
.scrub{flex:1;min-width:0}
.bar{height:4px;background:#1A1F2E;border-radius:2px;cursor:pointer}
.fill{height:100%;background:var(--mover);border-radius:2px;width:0}
.times{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:7px}
.seg{display:flex;background:#141826;border:1px solid var(--border);border-radius:9px;padding:3px;flex:0 0 auto}
.seg button{background:none;border:0;color:var(--muted);font:11.5px Inter,sans-serif;padding:6px 13px;
border-radius:7px;cursor:pointer}
.seg button.on{background:#22304A;color:var(--mover);font-weight:600}

/* ---------- mobile ---------- */
@media (max-width: 780px){
  body{-webkit-text-size-adjust:100%}
  header{height:48px;padding:0 14px}
  .eng{font-size:9.5px;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  main{flex-direction:column}
  section{order:1;flex:1 1 auto;min-height:46vh}
  aside{order:2;width:100%;flex:0 0 auto;max-height:40vh;border-right:0;border-top:1px solid var(--border)}
  #view{min-height:44vh}
  #legend{left:12px;bottom:10px;font-size:9.5px;line-height:1.7}
  .searchwrap{padding:10px 12px}
  #q{height:42px;font-size:16px}
  .up{height:40px;line-height:38px}
  .row{padding:12px 11px}
  .row .t{font-size:14px}
  footer{height:auto;flex-wrap:wrap;gap:10px 12px;padding:10px 12px 14px}
  #play{width:48px;height:48px;font-size:17px}
  .np{width:auto;flex:1 1 40%;min-width:0}
  .scrub{flex:1 1 100%;order:5}
  .bar{height:6px}
  .times{margin-top:6px}
  .seg{order:4;flex:1 1 auto;justify-content:space-between}
  .seg button{flex:1 1 0;padding:10px 8px;font-size:12px}
}
@media (max-width: 780px) and (orientation: landscape){
  main{flex-direction:row}
  aside{order:2;width:230px;max-height:none;border-top:0;border-left:1px solid var(--border)}
  section{order:1}
}
</style></head><body>
<header><div class="brand"><span class="dot"></span>DiveAudio</div>
<div class="eng">SADIE II · KU100 · <span id="lan"></span></div></header>
<main>
<aside>
  <div class="searchwrap"><input id="q" placeholder="Search your library" autocomplete="off">
    <label class="up" for="file" id="uplabel">＋ Upload a track</label>
    <input id="file" type="file" accept=".flac,.wav,.aif,.aiff,.m4a,.mp3,audio/*" hidden multiple></div>
  <div class="scope" id="scope">LIBRARY</div>
  <div id="list"></div>
</aside>
<section>
  <div id="view">
    <div id="legend"></div>
    <div id="status"><div class="eb" id="st-eb">SEPARATING STEMS</div>
      <div class="h" id="st-h">—</div><div class="sub" id="st-sub"></div></div>
  </div>
  <footer>
    <button id="play" disabled>▶</button>
    <div class="np"><div class="t" id="np-t">Nothing loaded</div><div class="s" id="np-s">Pick a track</div></div>
    <div class="scrub"><div class="bar" id="bar"><div class="fill" id="fill"></div></div>
      <div class="times"><span id="t-el">0:00</span><span id="t-re">0:00</span></div></div>
    <div class="seg" id="seg">
      <button data-p="subtle">Subtle</button>
      <button data-p="natural" class="on">Natural</button>
      <button data-p="wide">Wide</button></div>
  </footer>
</section>
</main>
<audio id="au"></audio>
<script src="/static/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
let preset="natural", curPath=null, meta={orbit:50,elev:25,ramp:20,beta:.85}, job=null;
$("#lan").textContent=location.host;

/* ---------- library ---------- */
async function load(q=""){
  const r=await (await fetch("/api/tracks?q="+encodeURIComponent(q))).json();
  $("#scope").textContent="LIBRARY · "+r.count+" TRACKS";
  $("#list").innerHTML="";
  for(const t of r.results){
    const d=document.createElement("div");d.className="row";
    d.innerHTML='<div class="t"></div><div class="s"></div>';
    d.children[0].textContent=t.name;
    d.children[1].textContent=t.dir+" · "+(t.ext||"").toUpperCase()+(t.mb?" · "+t.mb+" MB":"");
    d.onclick=()=>pick(t,d);
    $("#list").appendChild(d);
  }
}
async function upload(files){
  const lab=$("#uplabel"); let last=null;
  for(const f of files){
    lab.textContent="Uploading "+f.name.slice(0,26)+"…";
    const fd=new FormData(); fd.append("file",f);
    try{ const r=await (await fetch("/api/upload",{method:"POST",body:fd})).json();
      if(r.error){ lab.textContent=r.error; continue; }
      last=r; lab.textContent="Added "+r.name.slice(0,26);
    }catch(err){ lab.textContent="Upload failed"; }
  }
  await load($("#q").value);
  if(last){ const rows=[...document.querySelectorAll(".row")];
    const hit=rows.find(r=>r.children[0].textContent===last.name);
    if(hit) hit.click(); }
  setTimeout(()=>{$("#uplabel").textContent="＋ Upload a track"},3000);
}
$("#file").onchange=e=>{upload(e.target.files);e.target.value="";};
const aside=document.querySelector("aside");
["dragenter","dragover"].forEach(ev=>aside.addEventListener(ev,e=>{e.preventDefault();aside.classList.add("drag");}));
["dragleave","drop"].forEach(ev=>aside.addEventListener(ev,e=>{e.preventDefault();aside.classList.remove("drag");}));
aside.addEventListener("drop",e=>{ if(e.dataTransfer.files.length) upload(e.dataTransfer.files); });

let tmr; $("#q").oninput=e=>{clearTimeout(tmr);tmr=setTimeout(()=>load(e.target.value),160)};

async function pick(t,el){
  document.querySelectorAll(".row").forEach(r=>r.classList.remove("active"));
  el.classList.add("active");
  curPath=t.path; $("#np-t").textContent=t.name; $("#np-s").textContent=t.dir;
  await render();
}
$("#seg").onclick=e=>{ if(!e.target.dataset.p)return;
  [...$("#seg").children].forEach(b=>b.classList.toggle("on",b===e.target));
  preset=e.target.dataset.p; if(curPath) render(); };

async function render(){
  const au=$("#au"); au.pause(); $("#play").disabled=true;
  showStatus("SEPARATING STEMS",$("#np-t").textContent,
    "First time on a track this runs Demucs — about 4 minutes. After that it's cached and renders take ~20 seconds.");
  const r=await (await fetch("/api/render",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({path:curPath,preset})})).json();
  if(r.error){ showStatus("ERROR","Could not start",r.error); return; }
  job=r.job; poll();
}
let pollTimer=null;
function poll(){
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
  const iv=pollTimer=setInterval(async()=>{
    const j=await (await fetch("/api/job/"+job)).json();
    if(j.stage==="done"){ clearInterval(iv); pollTimer=null; meta=Object.assign(meta,j.meta||{});
      hideStatus(); const au=$("#au"); au.src="/api/audio/"+job; au.load();
      $("#play").disabled=false; au.play().catch(()=>{}); }
    else if(j.stage==="cancelled"){ clearInterval(iv); pollTimer=null; }
    else if(j.stage==="error"){ clearInterval(iv); pollTimer=null; showStatus("ERROR","Render failed",j.error||""); }
  },1500);
}
function showStatus(eb,h,s){$("#st-eb").textContent=eb;$("#st-h").textContent=h;$("#st-sub").textContent=s;$("#status").classList.add("on");}
function hideStatus(){$("#status").classList.remove("on");}

/* ---------- transport ---------- */
const au=$("#au");
$("#play").onclick=()=>au.paused?au.play():au.pause();
au.onplay=()=>$("#play").textContent="❚❚"; au.onpause=()=>$("#play").textContent="▶";
const fmt=s=>isFinite(s)?Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"):"0:00";
au.ontimeupdate=()=>{ if(!au.duration)return;
  $("#fill").style.width=(au.currentTime/au.duration*100)+"%";
  $("#t-el").textContent=fmt(au.currentTime); $("#t-re").textContent="−"+fmt(au.duration-au.currentTime); };
$("#bar").onclick=e=>{ if(au.duration){const r=e.currentTarget.getBoundingClientRect();
  au.currentTime=(e.clientX-r.left)/r.width*au.duration;} };

/* ---------- 3D scene ---------- */
const view=$("#view");
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(46,1,.1,100); cam.position.set(0,3.6,9.6); cam.lookAt(0,0,0);
const ren=new THREE.WebGLRenderer({antialias:true,alpha:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2)); view.appendChild(ren.domElement);
function resize(){
  const w=view.clientWidth, h=Math.max(view.clientHeight,1), asp=w/h;
  cam.aspect=asp;
  cam.fov = asp<1.1 ? 60 : 46;
  const need=R*1.22, vt=Math.tan(cam.fov*Math.PI/360);
  const d=Math.max(need/vt, need/(vt*asp));
  const ang = asp<1.1 ? 0.80 : 0.34;
  cam.position.set(0, d*Math.sin(ang), d*Math.cos(ang));
  cam.lookAt(0,-0.15,0);
  cam.updateProjectionMatrix(); ren.setSize(w,h);
}
new ResizeObserver(resize).observe(view);

const R=4.3;
function orb(color,r,op){ const g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(r,32,24),new THREE.MeshBasicMaterial({color})));
  g.add(new THREE.Mesh(new THREE.SphereGeometry(r*1.42,24,18),
    new THREE.MeshBasicMaterial({color,transparent:true,opacity:op,depthWrite:false})));
  scene.add(g); return g; }
const bass=orb(0x6B4BFF,.50,.13), drums=orb(0xFF9F45,.30,.13),
      voc =orb(0xFFEBC2,.24,.13), mover=orb(0x2FE3D0,.34,.22);
bass.position.set(0,-.28,0); drums.position.set(-1.55,.02,-.55); voc.position.set(.15,.62,-1.65);

function ring(rad,squash,color,op){ const p=[];
  for(let i=0;i<=180;i++){const a=i/180*Math.PI*2; p.push(new THREE.Vector3(Math.sin(a)*rad,0,-Math.cos(a)*rad*squash));}
  const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(p),
    new THREE.LineBasicMaterial({color,transparent:true,opacity:op})); scene.add(l); return l; }
ring(R,1,0x2A3A5E,1); ring(R*.66,1,0x1E2B44,.9);

const listener=new THREE.Mesh(new THREE.SphereGeometry(.16,20,16),
  new THREE.MeshBasicMaterial({color:0x6E7689,wireframe:true})); scene.add(listener);

const shadow=new THREE.Mesh(new THREE.CircleGeometry(.36,28),
  new THREE.MeshBasicMaterial({color:0x2FE3D0,transparent:true,opacity:.18,depthWrite:false}));
shadow.rotation.x=-Math.PI/2; shadow.position.y=-.9; scene.add(shadow);
const elevGeo=new THREE.BufferGeometry();
elevGeo.setAttribute("position",new THREE.BufferAttribute(new Float32Array(6),3));
scene.add(new THREE.Line(elevGeo,new THREE.LineBasicMaterial({color:0x2FE3D0,transparent:true,opacity:.30})));

const TN=90;
const trailGeo=new THREE.BufferGeometry();
trailGeo.setAttribute("position",new THREE.BufferAttribute(new Float32Array(TN*3),3));
scene.add(new THREE.Line(trailGeo,new THREE.LineBasicMaterial({color:0x2FE3D0,transparent:true,opacity:.6})));

function posAt(t){
  const az=(360*t/(meta.orbit||50))%360*Math.PI/180;
  const el=(meta.elev||25)*Math.sin(2*Math.PI*t/37)*Math.PI/180;
  return new THREE.Vector3(R*Math.cos(el)*Math.sin(az), R*Math.sin(el), -R*Math.cos(el)*Math.cos(az));
}
function tick(){
  const t=au.currentTime||0;
  mover.position.copy(posAt(t));
  const ramp=Math.min(t/(meta.ramp||20),1);
  mover.scale.setScalar(.5+.5*ramp);
  const arr=trailGeo.attributes.position.array;
  for(let i=0;i<TN;i++){ const p=posAt(Math.max(0,t-(TN-1-i)*.16));
    arr[i*3]=p.x; arr[i*3+1]=p.y; arr[i*3+2]=p.z; }
  trailGeo.attributes.position.needsUpdate=true;
  const p=mover.position;
  shadow.position.set(p.x,-.9,p.z);
  const rise=(p.y+R)/(2*R);
  shadow.scale.setScalar(1.25-.5*rise);
  shadow.material.opacity=.26-.14*rise;
  const ea=elevGeo.attributes.position.array;
  ea[0]=p.x; ea[1]=-.9;  ea[2]=p.z;
  ea[3]=p.x; ea[4]=p.y;  ea[5]=p.z;
  elevGeo.attributes.position.needsUpdate=true;
  scene.rotation.y=Math.sin(Date.now()/16000)*.05;
  ren.render(scene,cam); requestAnimationFrame(tick);
}
$("#legend").innerHTML=[["#6B4BFF","bass — anchored"],["#FF9F45","drums — anchored"],
  ["#FFEBC2","vocals — still"],["#2FE3D0","other — orbiting"]]
  .map(([c,l])=>'<div><i style="background:'+c+'"></i>'+l+'</div>').join("");
resize(); tick(); load();
</script></body></html>
