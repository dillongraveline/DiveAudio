<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DiveAudio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080910;--surface:#0F111A;--border:#1C2030;--txt:#E9EBF2;--muted:#6E7689;
--bass:#6B4BFF;--drums:#FF9F45;--vocals:#FFEBC2;--mover:#2FE3D0}
body{background:var(--bg);color:var(--txt);font:14px/1.5 Inter,-apple-system,system-ui,sans-serif;
height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{height:52px;background:var(--surface);display:flex;align-items:center;justify-content:space-between;
padding:0 20px;flex:0 0 auto;border-bottom:1px solid var(--border)}
.brand{display:flex;gap:9px;align-items:center;font-weight:600;letter-spacing:.3px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mover)}
.eng{font-size:11px;color:var(--muted)}
main{flex:1;display:flex;min-height:0}
aside{width:290px;background:var(--surface);border-right:1px solid var(--border);display:flex;
flex-direction:column;flex:0 0 auto}
.searchwrap{padding:14px}
#q{width:100%;height:36px;background:#161A27;border:1px solid var(--border);border-radius:9px;
color:var(--txt);padding:0 12px;font:13px Inter,sans-serif;outline:none}
#q:focus{border-color:#2b3550}
.up{display:block;margin-top:10px;height:36px;line-height:34px;text-align:center;border:1px dashed #2b3550;
border-radius:9px;color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up:hover{border-color:var(--mover);color:var(--mover)}
aside.drag{outline:2px dashed var(--mover);outline-offset:-6px}
.scope{font-size:9.5px;letter-spacing:1px;color:var(--muted);padding:0 16px 8px;font-weight:600}
#list{flex:1;overflow-y:auto;padding:0 8px 8px}
.row{padding:9px 11px;border-radius:8px;cursor:pointer}
.row:hover{background:#131826}
.row.active{background:#17202E}
.row .t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.active .t{color:var(--mover);font-weight:600}
.row .s{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
section{flex:1;display:flex;flex-direction:column;min-width:0}
#view{flex:1;position:relative;min-height:0}
#view canvas{display:block;position:absolute;inset:0;z-index:1}
#legend{position:absolute;z-index:4;left:22px;bottom:18px;font-size:10.5px;line-height:1.9;color:var(--muted)}
#legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}
#status{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;
justify-content:center;gap:14px;background:rgba(8,9,16,.93);text-align:center;padding:24px}
#status.on{display:flex}
#status .eb{font-size:10px;letter-spacing:2.2px;color:var(--mover);font-weight:600}
#status .h{font-size:26px;font-weight:600}
#status .sub{font-size:12.5px;color:var(--muted);max-width:420px}
footer{height:84px;background:var(--surface);border-top:1px solid var(--border);display:flex;
align-items:center;gap:20px;padding:0 20px;flex:0 0 auto}
#play{width:40px;height:40px;border-radius:50%;background:var(--mover);border:0;cursor:pointer;
color:#06231F;font-size:15px;flex:0 0 auto}
#play:disabled{opacity:.35;cursor:default}
.np{width:200px;min-width:0}
.np .t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .s{font-size:10.5px;color:var(--muted)}
.scrub{flex:1;min-width:0}
.bar{height:4px;background:#1A1F2E;border-radius:2px;cursor:pointer}
.fill{height:100%;background:var(--mover);border-radius:2px;width:0}
.times{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:7px}
.dl{display:none;align-items:center;gap:7px;height:34px;padding:0 15px;border-radius:8px;
border:1px solid var(--border);background:#141826;color:var(--txt);font-size:11.5px;
text-decoration:none;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.dl.on{display:inline-flex}
.dl:hover{border-color:var(--mover);color:var(--mover)}
.seg{display:flex;background:#141826;border:1px solid var(--border);border-radius:9px;padding:3px;flex:0 0 auto}
.seg button{background:none;border:0;color:var(--muted);font:11.5px Inter,sans-serif;padding:6px 13px;
border-radius:7px;cursor:pointer}
.seg button.on{background:#22304A;color:var(--mover);font-weight:600}

/* ---------- mobile ---------- */
@media (max-width: 780px){
  html,body{height:100vh;height:100dvh;overscroll-behavior:none}
  header{height:46px;padding:0 12px;flex:0 0 auto}
  .brand{font-size:13px}
  .eng{font-size:9px;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* single column; every flex child gets min-height:0 so nothing can overflow
     its parent and collide with the next element */
  main{flex-direction:column;min-height:0}
  section{order:1;flex:1 1 auto;min-height:0}
  #view{flex:1 1 auto;min-height:160px}
  aside{order:2;width:100%;flex:0 0 auto;max-height:34vh;min-height:0;
        border-right:0;border-top:1px solid var(--border)}
  #list{min-height:0;-webkit-overflow-scrolling:touch}

  .searchwrap{padding:9px 12px 4px}
  #q{height:40px;font-size:16px}          /* 16px stops iOS zooming on focus */
  .up{height:38px;line-height:36px;margin-top:8px}
  .scope{padding:0 12px 6px}
  .row{padding:11px}
  .row .t{font-size:13.5px}

  /* legend pinned to the top of the scene, away from the orbit, with a
     backdrop so it never sits illegibly on top of an orb */
  #legend{top:0;left:0;right:0;bottom:auto;display:flex;flex-wrap:wrap;
          gap:2px 12px;padding:7px 12px 9px;font-size:9px;line-height:1.5;
          background:linear-gradient(180deg,rgba(8,9,16,.92),rgba(8,9,16,0))}
  #legend div{white-space:nowrap}
  #legend i{width:6px;height:6px;margin-right:5px}

  footer{height:auto;flex:0 0 auto;flex-wrap:wrap;gap:8px 12px;padding:9px 12px 12px}
  #play{order:1;width:44px;height:44px;font-size:16px}
  .dl{order:3;height:38px;padding:0 12px;font-size:11px}
  .np{order:2;width:auto;flex:1 1 0;min-width:0}
  .scrub{order:5}
  .seg{order:3;flex:1 1 100%;justify-content:space-between}
  .seg button{flex:1 1 0;padding:10px 6px;font-size:12px}
  .scrub{order:4;flex:1 1 100%}
  .bar{height:6px}
  .times{margin-top:6px}
}
@media (max-width: 780px) and (orientation: landscape){
  main{flex-direction:row}
  aside{order:2;width:220px;max-height:none;border-top:0;border-left:1px solid var(--border)}
  section{order:1;min-height:0}
  #legend{position:absolute;top:auto;bottom:6px;background:none;padding:0 0 0 12px}
  footer{flex-wrap:nowrap}
  .seg{flex:0 0 auto}
  .scrub{flex:1 1 auto;order:3}
}
</style></head><body>
<header><div class="brand"><span class="dot"></span>DiveAudio</div>
<div class="eng">SADIE II · KU100 · <span id="lan"></span></div></header>
<main>
<aside>
  <div class="searchwrap"><input id="q" placeholder="Search your library" autocomplete="off">
    <label class="up" for="file" id="uplabel">＋ Upload a track</label>
    <input id="file" type="file" accept=".flac,.wav,.aif,.aiff,.m4a,.mp3,audio/*" hidden multiple></div>
  <div class="scope" id="scope">LIBRARY</div>
  <div id="list"></div>
</aside>
<section>
  <div id="view">
    <div id="legend"></div>
    <div id="status"><div class="eb" id="st-eb">SEPARATING STEMS</div>
      <div class="h" id="st-h">—</div><div class="sub" id="st-sub"></div></div>
  </div>
  <footer>
    <button id="play" disabled>▶</button>
    <div class="np"><div class="t" id="np-t">Nothing loaded</div><div class="s" id="np-s">Pick a track</div></div>
    <a class="dl" id="dl" href="#" download>&#8595;&nbsp; Download FLAC</a>
    <div class="scrub"><div class="bar" id="bar"><div class="fill" id="fill"></div></div>
      <div class="times"><span id="t-el">0:00</span><span id="t-re">0:00</span></div></div>
  </footer>
</section>
</main>
<audio id="au"></audio>
<script src="/static/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const preset="default";
let curPath=null, meta={orbit:43,elev:25,ramp:20,beta:.92}, job=null;
$("#lan").textContent=location.host;

/* ---------- library ---------- */
async function load(q=""){
  const r=await (await fetch("/api/tracks?q="+encodeURIComponent(q))).json();
  $("#scope").textContent="LIBRARY · "+r.count+" TRACKS";
  $("#list").innerHTML="";
  for(const t of r.results){
    const d=document.createElement("div");d.className="row";
    d.innerHTML='<div class="t"></div><div class="s"></div>';
    d.children[0].textContent=t.name;
    d.children[1].textContent=t.dir+" · "+(t.ext||"").toUpperCase()+(t.mb?" · "+t.mb+" MB":"");
    d.onclick=()=>pick(t,d);
    $("#list").appendChild(d);
  }
}
async function upload(files){
  const lab=$("#uplabel"); let last=null;
  for(const f of files){
    lab.textContent="Uploading "+f.name.slice(0,26)+"…";
    const fd=new FormData(); fd.append("file",f);
    try{ const r=await (await fetch("/api/upload",{method:"POST",body:fd})).json();
      if(r.error){ lab.textContent=r.error; continue; }
      last=r; lab.textContent="Added "+r.name.slice(0,26);
    }catch(err){ lab.textContent="Upload failed"; }
  }
  await load($("#q").value);
  if(last){ const rows=[...document.querySelectorAll(".row")];
    const hit=rows.find(r=>r.children[0].textContent===last.name);
    if(hit) hit.click(); }
  setTimeout(()=>{$("#uplabel").textContent="＋ Upload a track"},3000);
}
$("#file").onchange=e=>{upload(e.target.files);e.target.value="";};
const aside=document.querySelector("aside");
["dragenter","dragover"].forEach(ev=>aside.addEventListener(ev,e=>{e.preventDefault();aside.classList.add("drag");}));
["dragleave","drop"].forEach(ev=>aside.addEventListener(ev,e=>{e.preventDefault();aside.classList.remove("drag");}));
aside.addEventListener("drop",e=>{ if(e.dataTransfer.files.length) upload(e.dataTransfer.files); });

let tmr; $("#q").oninput=e=>{clearTimeout(tmr);tmr=setTimeout(()=>load(e.target.value),160)};

async function pick(t,el){
  document.querySelectorAll(".row").forEach(r=>r.classList.remove("active"));
  el.classList.add("active");
  curPath=t.path; $("#np-t").textContent=t.name; $("#np-s").textContent=t.dir;
  await render();
}

async function render(){
  const au=$("#au"); au.pause(); $("#play").disabled=true;
  $("#dl").classList.remove("on");
  showStatus("SEPARATING STEMS",$("#np-t").textContent,
    "First time on a track this runs Demucs — about 4 minutes. After that it's cached and renders take ~20 seconds.");
  const r=await (await fetch("/api/render",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({path:curPath,preset})})).json();
  if(r.error){ showStatus("ERROR","Could not start",r.error); return; }
  job=r.job; poll();
}
let pollTimer=null;
function poll(){
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
  const iv=pollTimer=setInterval(async()=>{
    const j=await (await fetch("/api/job/"+job)).json();
    if(j.stage==="done"){ clearInterval(iv); pollTimer=null; meta=Object.assign(meta,j.meta||{});
      hideStatus(); const au=$("#au"); au.src="/api/audio/"+job; au.load();
      $("#play").disabled=false; au.play().catch(()=>{});
      const dl=$("#dl"); dl.href="/api/download/"+job; dl.classList.add("on"); }
    else if(j.stage==="cancelled"){ clearInterval(iv); pollTimer=null; }
    else if(j.stage==="error"){ clearInterval(iv); pollTimer=null; showStatus("ERROR","Render failed",j.error||""); }
  },1500);
}
function showStatus(eb,h,s){$("#st-eb").textContent=eb;$("#st-h").textContent=h;$("#st-sub").textContent=s;$("#status").classList.add("on");}
function hideStatus(){$("#status").classList.remove("on");}

/* ---------- transport ---------- */
const au=$("#au");
$("#play").onclick=()=>au.paused?au.play():au.pause();
au.onplay=()=>$("#play").textContent="❚❚"; au.onpause=()=>$("#play").textContent="▶";
const fmt=s=>isFinite(s)?Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"):"0:00";
au.ontimeupdate=()=>{ if(!au.duration)return;
  $("#fill").style.width=(au.currentTime/au.duration*100)+"%";
  $("#t-el").textContent=fmt(au.currentTime); $("#t-re").textContent="−"+fmt(au.duration-au.currentTime); };
$("#bar").onclick=e=>{ if(au.duration){const r=e.currentTarget.getBoundingClientRect();
  au.currentTime=(e.clientX-r.left)/r.width*au.duration;} };

/* ---------- 3D room ---------- */
const view=$("#view");
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(48,1,.1,200);
const ren=new THREE.WebGLRenderer({antialias:true,alpha:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2)); view.appendChild(ren.domElement);

/* room: listener at origin, x=width, y=height, z=depth */
const RW=6.4, RH=3.2, RD=5.6;                 /* half-extents */
const WALLS=[
  {n:"right", p:[ RW,0,0], q:[0,-Math.PI/2,0], w:RD*2, h:RH*2},
  {n:"left",  p:[-RW,0,0], q:[0, Math.PI/2,0], w:RD*2, h:RH*2},
  {n:"front", p:[0,0,-RD], q:[0,0,0],          w:RW*2, h:RH*2},
  {n:"back",  p:[0,0, RD], q:[0,Math.PI,0],    w:RW*2, h:RH*2},
  {n:"floor", p:[0,-RH,0], q:[-Math.PI/2,0,0], w:RW*2, h:RD*2},
  {n:"ceil",  p:[0, RH,0], q:[ Math.PI/2,0,0], w:RW*2, h:RD*2}
];
const wallMeshes=WALLS.map(W=>{
  const m=new THREE.Mesh(new THREE.PlaneGeometry(W.w,W.h),
    new THREE.MeshBasicMaterial({color:0x2FE3D0,transparent:true,opacity:.02,
      side:THREE.DoubleSide,depthWrite:false}));
  m.position.set(...W.p); m.rotation.set(...W.q); m.userData=W; scene.add(m); return m;
});
scene.add(new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(RW*2,RH*2,RD*2)),
  new THREE.LineBasicMaterial({color:0x2B3A5E,transparent:true,opacity:.5})));
const grid=new THREE.GridHelper(RW*2,16,0x1E2B44,0x141d2e);
grid.position.y=-RH+0.01; scene.add(grid);

/* sources */
function orb(color,r,op){ const g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(r,32,24),new THREE.MeshBasicMaterial({color})));
  g.add(new THREE.Mesh(new THREE.SphereGeometry(r*1.45,24,18),
    new THREE.MeshBasicMaterial({color,transparent:true,opacity:op,depthWrite:false})));
  scene.add(g); return g; }
const SRC=[
  {k:"bass",   col:0x6B4BFF, g:orb(0x6B4BFF,.46,.13), base:new THREE.Vector3(0,-1.5,-.4),  moves:false},
  {k:"drums",  col:0xFF9F45, g:orb(0xFF9F45,.30,.13), base:new THREE.Vector3(-1.9,-.2,-1.6), moves:false},
  {k:"vocals", col:0xFFEBC2, g:orb(0xFFEBC2,.26,.13), base:new THREE.Vector3(.2,.5,-2.2),  moves:false},
  {k:"other",  col:0x2FE3D0, g:orb(0x2FE3D0,.34,.22), base:new THREE.Vector3(0,0,0),       moves:true}
];
SRC.forEach(s=>s.pos=s.base.clone());

/* drums and vocals drift by amplitude pan in the render; mirror it here so the
   picture still equals the audio. Scale maps pan [-1,1] to room x. */
const DRIFT_X=2.4;
function driftX(k,t){
  const d=(meta.drift||{})[k];
  return d ? DRIFT_X*d.span*Math.sin(2*Math.PI*t/d.period + d.phase) : 0;
}
const listener=new THREE.Mesh(new THREE.SphereGeometry(.17,20,16),
  new THREE.MeshBasicMaterial({color:0x8892A6,wireframe:true})); scene.add(listener);

/* wavefronts: 3 concurrent per source, phase derived purely from currentTime
   so scrubbing stays correct */
const FRONTS=3, WPER=2.6, WMAX=8.4;
SRC.forEach(s=>{ s.waves=[];
  for(let i=0;i<FRONTS;i++){
    const m=new THREE.Mesh(new THREE.SphereGeometry(1,20,14),
      new THREE.MeshBasicMaterial({color:s.col,wireframe:true,transparent:true,
        opacity:.16,depthWrite:false}));
    scene.add(m); s.waves.push(m);
  }});

/* mover trail */
const TN=90, trailGeo=new THREE.BufferGeometry();
trailGeo.setAttribute("position",new THREE.BufferAttribute(new Float32Array(TN*3),3));
scene.add(new THREE.Line(trailGeo,new THREE.LineBasicMaterial(
  {color:0x2FE3D0,transparent:true,opacity:.5})));
const shadow=new THREE.Mesh(new THREE.CircleGeometry(.34,26),
  new THREE.MeshBasicMaterial({color:0x2FE3D0,transparent:true,opacity:.2,depthWrite:false}));
shadow.rotation.x=-Math.PI/2; scene.add(shadow);
const elevGeo=new THREE.BufferGeometry();
elevGeo.setAttribute("position",new THREE.BufferAttribute(new Float32Array(6),3));
scene.add(new THREE.Line(elevGeo,new THREE.LineBasicMaterial(
  {color:0x2FE3D0,transparent:true,opacity:.3})));

/* trajectory - must match spatialize_cli.py exactly */
const R=4.1;
function posAt(t){
  const s=(meta.orbit||43)/50, TAU=2*Math.PI;
  const azd=180*(0.55*Math.sin(TAU*t/(97*s))+0.30*Math.sin(TAU*t/(61*s)+1.7)
                +0.15*Math.sin(TAU*t/(37*s)+4.1));
  const eld=(meta.elev||25)*1.2*(0.60*Math.sin(TAU*t/(71*s)+0.8)
                                +0.40*Math.sin(TAU*t/(43*s)+2.9));
  const az=azd*Math.PI/180, el=eld*Math.PI/180;
  return new THREE.Vector3(R*Math.cos(el)*Math.sin(az),R*Math.sin(el),-R*Math.cos(el)*Math.cos(az));
}

/* drag to spin, wheel/pinch to zoom */
let yaw=0.5, pitch=0.32, dist=15.5, drag=null, pinch=null;
function applyCam(){
  pitch=Math.max(-1.35,Math.min(1.35,pitch));
  dist=Math.max(7,Math.min(34,dist));
  cam.position.set(dist*Math.cos(pitch)*Math.sin(yaw),dist*Math.sin(pitch),
                   dist*Math.cos(pitch)*Math.cos(yaw));
  cam.lookAt(0,-.2,0);
}
const el2=ren.domElement;
el2.style.touchAction="none";
el2.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY};el2.setPointerCapture(e.pointerId);});
el2.addEventListener("pointermove",e=>{ if(!drag)return;
  yaw-=(e.clientX-drag.x)*.006; pitch+=(e.clientY-drag.y)*.005;
  drag={x:e.clientX,y:e.clientY}; applyCam(); });
["pointerup","pointercancel","pointerleave"].forEach(ev=>el2.addEventListener(ev,()=>drag=null));
el2.addEventListener("wheel",e=>{e.preventDefault();dist*=1+Math.sign(e.deltaY)*.09;applyCam();},{passive:false});
el2.addEventListener("touchstart",e=>{ if(e.touches.length===2){
  pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                   e.touches[0].clientY-e.touches[1].clientY); drag=null; }},{passive:true});
el2.addEventListener("touchmove",e=>{ if(e.touches.length===2&&pinch){
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                     e.touches[0].clientY-e.touches[1].clientY);
  dist*=pinch/d; pinch=d; applyCam(); }},{passive:true});
el2.addEventListener("touchend",()=>pinch=null);

function resize(){
  const w=view.clientWidth,h=Math.max(view.clientHeight,1),asp=w/h;
  cam.aspect=asp; cam.fov=asp<1.1?62:48;
  dist=Math.max(dist, asp<1.1?20:14);
  cam.updateProjectionMatrix(); ren.setSize(w,h); applyCam();
}
new ResizeObserver(resize).observe(view);

/* live level from the actual audio */
let analyser=null,freqBuf=null;
function initAnalyser(){
  if(analyser) return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const src=ctx.createMediaElementSource($("#au"));
    analyser=ctx.createAnalyser(); analyser.fftSize=512;
    src.connect(analyser); analyser.connect(ctx.destination);
    freqBuf=new Uint8Array(analyser.frequencyBinCount);
    if(ctx.state==="suspended") ctx.resume();
  }catch(e){ analyser=null; }
}
$("#au").addEventListener("play",initAnalyser);
function level(lo,hi){
  if(!analyser) return .35;
  analyser.getByteFrequencyData(freqBuf);
  const n=freqBuf.length, a=Math.floor(n*lo), b=Math.floor(n*hi);
  let s=0; for(let i=a;i<b;i++) s+=freqBuf[i];
  return Math.min(1,(s/Math.max(1,b-a))/140);
}

const BAND={bass:[0,.06], drums:[.06,.22], vocals:[.05,.3], other:[.22,.9]};
function tick(){
  const t=$("#au").currentTime||0;
  const wallHit=new Array(WALLS.length).fill(0);

  SRC.forEach((s,si)=>{
    if(s.moves) s.pos.copy(posAt(t));
    else s.pos.set(s.base.x + driftX(s.k,t), s.base.y, s.base.z);
    s.g.position.copy(s.pos);
    const lv=level(...BAND[s.k]);
    s.g.scale.setScalar(.82+.5*lv);

    for(let i=0;i<FRONTS;i++){
      const ph=((t/WPER)+i/FRONTS+si*.17)%1;
      const r=ph*WMAX;
      const m=s.waves[i];
      m.position.copy(s.pos); m.scale.setScalar(Math.max(.001,r));
      m.material.opacity=Math.max(0,.19*(1-ph)*(0.35+lv));
      WALLS.forEach((W,wi)=>{
        const d=Math.abs(W.n==="right"?RW-s.pos.x : W.n==="left"?s.pos.x+RW :
                         W.n==="front"?s.pos.z+RD : W.n==="back"?RD-s.pos.z :
                         W.n==="floor"?s.pos.y+RH : RH-s.pos.y);
        if(Math.abs(r-d)<0.55) wallHit[wi]=Math.max(wallHit[wi],(1-Math.abs(r-d)/0.55)*(0.3+lv));
      });
    }
  });
  wallMeshes.forEach((m,i)=>{ m.material.opacity=.02+wallHit[i]*.20; });

  const mv=SRC[3].pos, arr=trailGeo.attributes.position.array;
  for(let i=0;i<TN;i++){ const p=posAt(Math.max(0,t-(TN-1-i)*.22));
    arr[i*3]=p.x; arr[i*3+1]=p.y; arr[i*3+2]=p.z; }
  trailGeo.attributes.position.needsUpdate=true;
  shadow.position.set(mv.x,-RH+.02,mv.z);
  const rise=(mv.y+RH)/(2*RH);
  shadow.scale.setScalar(1.25-.5*rise); shadow.material.opacity=.26-.14*rise;
  const ea=elevGeo.attributes.position.array;
  ea[0]=mv.x; ea[1]=-RH+.02; ea[2]=mv.z; ea[3]=mv.x; ea[4]=mv.y; ea[5]=mv.z;
  elevGeo.attributes.position.needsUpdate=true;

  ren.render(scene,cam); requestAnimationFrame(tick);
}
$("#legend").innerHTML=[["#6B4BFF","bass"],["#FF9F45","drums"],
  ["#FFEBC2","vocals"],["#2FE3D0","other — moving"]]
  .map(([c,l])=>'<div><i style="background:'+c+'"></i>'+l+'</div>').join("")
  +'<div style="opacity:.55">drag to spin · scroll to zoom</div>';
resize(); tick(); load();
</script></body></html>
